name: Restore and verify Cyber Wealth

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-project.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Restore application files from repair archive
        run: |
          test -s cyber-wealth-database-repair.zip
          unzip -oq cyber-wealth-database-repair.zip -d .
          test -s package.json
          test -s netlify.toml
          test -d src/pages
      - name: Install dependencies and verify source
        run: |
          npm ci
          npm run check
          npm run build
        env:
          DATABASE_URL: postgres://build:build@127.0.0.1:5432/build
          JWT_SECRET: build-only-secret-not-for-production-123456789
          NETLIFY: "true"
      - name: Commit restored source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Restore and verify Cyber Wealth application"
            git push
          fi
