name: Restore Cyber Wealth source

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/restore-project.yml"

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Restore application files from repair archive
        run: |
          test -s cyber-wealth-database-repair.zip
          unzip -oq cyber-wealth-database-repair.zip -d .
          test -s package.json
          test -s netlify.toml
          test -d src/pages
      - name: Commit restored source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Restore Cyber Wealth application source"
            git push
          fi
